// ============================================================================
// Toolchain Configuration
// ============================================================================
// Configure toolchain resolver for auto-provisioning of JDKs
plugins
{
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// ============================================================================
// Root Project Configuration
// ============================================================================
rootProject.name = 'cics-java-liberty-springboot-jdbc'

// ============================================================================
// Subprojects
// ============================================================================
include(':cics-java-liberty-springboot-jdbc-app')
include(':cics-java-liberty-springboot-jdbc-cicsbundle')

